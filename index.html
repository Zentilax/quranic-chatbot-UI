<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quranic QA Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255, 255, 255, 0.1) 10px,
                rgba(255, 255, 255, 0.1) 20px
            );
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%); }
            100% { transform: translateX(100%) translateY(100%); }
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .chat-container {
            padding: 30px;
            min-height: 400px;
            max-height: 500px;
            overflow-y: auto;
            background: #f8fafc;
        }

        .input-section {
            padding: 30px;
            background: white;
            border-top: 1px solid #e2e8f0;
        }

        .input-wrapper {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        #queryInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            background: #f8fafc;
        }

        #queryInput:focus {
            border-color: #4facfe;
            background: white;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        #sendBtn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        #sendBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 172, 254, 0.3);
        }

        #sendBtn:active {
            transform: translateY(0);
        }

        #sendBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            text-align: right;
        }

        .user-bubble {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 20px 20px 5px 20px;
            max-width: 70%;
            word-wrap: break-word;
            font-size: 16px;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .bot-message {
            text-align: left;
        }

        .bot-bubble {
            display: inline-block;
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 5px 20px 20px 20px;
            max-width: 85%;
            word-wrap: break-word;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #4facfe;
        }

        .response-section {
            margin-top: 15px;
        }

        .response-label {
            font-weight: 600;
            color: #4facfe;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .response-content {
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-left: 3px solid #4facfe;
            margin-bottom: 15px;
        }

        .final-response {
            background: #f0fdf4;
            border-left-color: #22c55e;
            color: #15803d;
            font-family: inherit;
            font-size: 16px;
            line-height: 1.6;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #64748b;
            font-style: italic;
        }

        .loading-dots {
            display: flex;
            gap: 4px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4facfe;
            animation: bounce 1.4s ease-in-out infinite both;
        }

        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        .error {
            background: #fef2f2;
            color: #dc2626;
            border-left-color: #dc2626;
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            font-style: italic;
            margin-top: 50px;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .input-wrapper {
                flex-direction: column;
                gap: 15px;
            }

            #queryInput, #sendBtn {
                width: 100%;
            }

            .user-bubble, .bot-bubble {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🕌 Quranic QA System</h1>
            <p>Ask questions about the Quran and receive detailed answers</p>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="empty-state">
                <div class="empty-state-icon">📖</div>
                <p>Start by asking a question about the Quran</p>
                <p style="margin-top: 10px; font-size: 14px;">Example: "What is in Al-Alaq verse 1-5?"</p>
            </div>
        </div>
        
        <div class="input-section">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="queryInput" 
                    placeholder="Ask your question about the Quran..."
                    maxlength="500"
                >
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://quranic-chatbot-production.up.railway.app";
        const chatContainer = document.getElementById('chatContainer');
        const queryInput = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');

        // Initialize
        let isFirstMessage = true;

        // Event listeners
        sendBtn.addEventListener('click', handleSend);
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        async function handleSend() {
            const query = queryInput.value.trim();
            if (!query) return;

            // Clear empty state on first message
            if (isFirstMessage) {
                chatContainer.innerHTML = '';
                isFirstMessage = false;
            }

            // Add user message
            addUserMessage(query);
            
            // Clear input and disable button
            queryInput.value = '';
            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';

            // Add loading message
            const loadingId = addLoadingMessage();

            try {
                const response = await fetch(`${API_URL}/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query: query })
                });

                // Remove loading message
                removeMessage(loadingId);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const result = await response.json();
                
                // Add bot response
                addBotMessage(result);

            } catch (error) {
                // Remove loading message and show error
                removeMessage(loadingId);
                addErrorMessage(error.message);
            } finally {
                // Re-enable button
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send';
                queryInput.focus();
            }
        }

        function addUserMessage(message) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user-message';
            messageDiv.innerHTML = `<div class="user-bubble">${escapeHtml(message)}</div>`;
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function addBotMessage(result) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot-message';
            
            let content = '<div class="bot-bubble">';
            
            // Add original query
            if (result.query) {
                content += `
                    <div class="response-section">
                        <div class="response-label">📝 Query:</div>
                        <div class="response-content">${escapeHtml(result.query)}</div>
                    </div>
                `;
            }
            
            // Add CQL if available
            if (result.cql && result.cql !== "— (no CQL generated)") {
                content += `
                    <div class="response-section">
                        <div class="response-label">⚙️ Generated CQL:</div>
                        <div class="response-content">${escapeHtml(result.cql)}</div>
                    </div>
                `;
            }
            
            // Add final response
            if (result.response) {
                content += `
                    <div class="response-section">
                        <div class="response-label">💬 Response:</div>
                        <div class="response-content final-response">${formatResponse(result.response)}</div>
                    </div>
                `;
            }
            
            content += '</div>';
            messageDiv.innerHTML = content;
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function addLoadingMessage() {
            const messageId = 'loading-' + Date.now();
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot-message';
            messageDiv.id = messageId;
            messageDiv.innerHTML = `
                <div class="bot-bubble loading">
                    <span>Searching the Quran</span>
                    <div class="loading-dots">
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
            return messageId;
        }

        function addErrorMessage(error) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot-message';
            messageDiv.innerHTML = `
                <div class="bot-bubble">
                    <div class="response-section">
                        <div class="response-label" style="color: #dc2626;">❌ Error:</div>
                        <div class="response-content error">${escapeHtml(error)}</div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function removeMessage(messageId) {
            const element = document.getElementById(messageId);
            if (element) {
                element.remove();
            }
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatResponse(response) {
            // Convert line breaks to HTML and escape HTML
            return escapeHtml(response).replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
